<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North Sea Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <header class="hud">
    <h1>NORTH SEA TRACKER</h1>
    <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Connecting...</span></div>
    <div class="stats">
      <div><span id="stat-count">0</span><label>ships</label></div>
      <div><span id="stat-moving">0</span><label>moving</label></div>
      <div><span id="stat-fastest">-</span><label>fastest (kn)</label></div>
      <div><span id="stat-alerts" class="alerts-count">0</span><label>alerts</label></div>
    </div>
    <div id="demo-badge" class="demo-badge" hidden>DEMO DATA</div>
  </header>

  <aside id="panel" class="panel">
    <button id="panel-close" class="close" aria-label="Close">X</button>
    <div class="panel-type" id="p-type"></div>
    <h2 id="p-name"></h2>
    <div class="panel-mmsi">MMSI <span id="p-mmsi"></span></div>
    <dl>
      <dt>Speed</dt><dd id="p-speed"></dd>
      <dt>Course</dt><dd id="p-course"></dd>
      <dt>Heading to</dt><dd id="p-dest"></dd>
      <dt>Distance to harbour</dt><dd id="p-dist"></dd>
      <dt>Last heard</dt><dd id="p-seen"></dd>
    </dl>
    <div id="p-alert" class="panel-alert" hidden></div>
  </aside>

  <section class="feed">
    <h3>Activity</h3>
    <ul id="feed-list"><li class="empty">Waiting for something to happen...</li></ul>
  </section>

  <section class="arrivals">
    <h3>Arriving at Aberdeen</h3>
    <ul id="arrivals-list"><li class="empty">Nothing heading in right now</li></ul>
  </section>

  <div class="legend" id="legend"></div>

  <div class="controls">
    <button id="view-toggle">Satellite view</button>
    <button id="heat-toggle">Heatmap</button>
    <button id="replay-toggle">Replay</button>
  </div>

  <div id="replay-bar" class="replay-bar" hidden>
    <button id="replay-play">Play</button>
    <input id="replay-slider" type="range" min="0" max="0" value="0">
    <span id="replay-time">--:--</span>
    <button id="replay-exit">Back to live</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="map.js"></script>
</body>
</html>
